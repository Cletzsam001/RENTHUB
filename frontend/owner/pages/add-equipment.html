
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Equipment | RentHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/add-equipment.js" defer></script>
</head>

<body class="m-0 min-h-screen overflow-x-hidden bg-white font-sans text-[#111111] lg:bg-[#F2F7FB]">

  <!-- DESKTOP SIDEBAR -->
  <aside class="fixed inset-y-0 left-0 z-50 hidden w-[230px] flex-col bg-[#224F78] px-5 py-6 text-white lg:flex">

    <!-- LOGO -->
    <a href="dashboard.html" class="mb-9 flex shrink-0 items-center gap-3">
      <span class="flex h-10 w-10 items-center justify-center rounded-full bg-[#102E4B]">
        <img src="../../assets/icons/logo.svg" alt="RentHub logo" class="h-8 w-8 object-contain">
      </span>
      <span class="text-[20px] font-semibold">RentHub</span>
    </a>

    <!-- OWNER NAVIGATION -->
    <nav aria-label="Owner navigation" class="min-h-0 flex-1 space-y-1 overflow-y-auto">

      <a href="dashboard.html" class="flex min-h-[43px] items-center gap-3 rounded-xl px-3 py-2 text-[14px] font-medium text-white/90 transition hover:bg-white/10">
        <img src="../../assets/icons/ehome.svg" alt="" class="h-5 w-5 shrink-0 object-contain">
        <span>Dashboard</span>
      </a>

      <a href="./equipment.html" aria-current="page" class="flex min-h-[43px] items-center gap-3 rounded-xl bg-[#F2F7FB] px-3 py-2 text-[14px] font-semibold text-[#224F78]">
        <img src="../../assets/icons/equipment2.svg" alt="" class="h-5 w-5 shrink-0 object-contain">
        <span>Equipments</span>
      </a>

      <a href="booking.html" class="flex min-h-[43px] items-center gap-3 rounded-xl px-3 py-2 text-[14px] font-medium text-white/90 transition hover:bg-white/10">
        <img src="../../assets/icons/booking.svg" alt="" class="h-5 w-5 shrink-0 object-contain">
        <span>Bookings</span>
      </a>

      <a href="finance.html" class="flex min-h-[43px] items-center gap-3 rounded-xl px-3 py-2 text-[14px] font-medium text-white/90 transition hover:bg-white/10">
        <img src="../../assets/icons/finance.svg" alt="" class="h-5 w-5 shrink-0 object-contain">
        <span>Finance</span>
      </a>

      <a href="../deposit.html" class="flex min-h-[43px] items-center gap-3 rounded-xl px-3 py-2 text-[14px] font-medium text-white/90 transition hover:bg-white/10">
        <img src="../../assets/icons/deposite.svg" alt="" class="h-5 w-5 shrink-0 object-contain">
        <span>Deposit</span>
      </a>

      <a href="../dispute.html" class="flex min-h-[43px] items-center gap-3 rounded-xl px-3 py-2 text-[14px] font-medium text-white/90 transition hover:bg-white/10">
        <img src="../../assets/icons/dispute.svg" alt="" class="h-5 w-5 shrink-0 object-contain">
        <span>Dispute</span>
      </a>

      <a href="../reviews.html" class="flex min-h-[43px] items-center gap-3 rounded-xl px-3 py-2 text-[14px] font-medium text-white/90 transition hover:bg-white/10">
        <img src="../../assets/icons/review.svg" alt="" class="h-5 w-5 shrink-0 object-contain">
        <span>Review</span>
      </a>

      <a href="profile.html" class="flex min-h-[43px] items-center gap-3 rounded-xl px-3 py-2 text-[14px] font-medium text-white/90 transition hover:bg-white/10">
        <img src="../../assets/icons/user.svg" alt="" class="h-5 w-5 shrink-0 object-contain">
        <span>Profile</span>
      </a>

    </nav>

    <!-- LOGOUT -->
    <button id="logoutButton" type="button" class="mt-4 flex min-h-[43px] shrink-0 items-center gap-3 rounded-xl px-3 py-2 text-left text-[14px] font-medium transition hover:bg-white/10">
      <img src="../../assets/icons/sign.svg" alt="" class="h-5 w-5 shrink-0 object-contain">
      <span>Log out</span>
    </button>

  </aside>

  <!-- PAGE WRAPPER -->
  <div class="min-h-screen lg:ml-[230px]">

    <!-- STICKY DESKTOP HEADER -->
    <header class="sticky top-0 z-40 hidden h-[78px] items-center justify-between gap-5 border-b border-[#E6EBF0] bg-white px-7 lg:flex">

      <div class="relative w-full max-w-[510px]">
        <img src="../../assets/icons/search.svg" alt="" class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 object-contain">
        <input id="headerSearch" type="search" placeholder="Search for equipment, categories or location..." aria-label="Search equipment" class="h-[46px] w-full rounded-xl border border-[#E2E5E8] bg-[#F2F7FB] pl-12 pr-4 text-sm outline-none focus:border-[#224F78]">
      </div>

      <a href="profile.html" aria-label="Open owner profile" class="shrink-0">
        <img src="../../assets/icons/profile.svg" alt="Owner profile" class="h-11 w-11 rounded-full object-cover">
      </a>

    </header>

    <!-- MAIN CONTENT -->
    <main class="mx-auto w-full max-w-[1250px] px-4 pb-28 pt-6 sm:px-8 lg:px-[33px] lg:pb-10 lg:pt-5">

      <!-- PAGE HEADING -->
      <div class="relative mb-8 flex min-h-10 items-center justify-center lg:mb-5 lg:justify-start lg:gap-4">

        <a href="./equipment.html" aria-label="Back to equipment" class="absolute left-0 flex h-10 w-10 items-center justify-center lg:static">
          <img src="../../assets/icons/backspace.svg" alt="" class="h-7 w-7 object-contain">
        </a>

        <h1 class="text-[22px] font-semibold text-[#224F78] sm:text-[25px] lg:text-[23px] lg:text-black">
          Add Equipment
        </h1>

      </div>

      <!-- EQUIPMENT FORM -->
      <section class="bg-white lg:rounded-[20px] lg:px-[28px] lg:py-[27px]">

        <form id="addEquipmentForm" class="space-y-[23px] lg:space-y-5" novalidate>

          <!-- EQUIPMENT NAME -->
          <div>
            <label for="equipmentName" class="mb-2 block text-[17px] font-semibold lg:text-[16px]">Equipment Name</label>
            <input id="equipmentName" name="name" type="text" maxlength="120" required placeholder="Enter the name of your equipment" class="h-[46px] w-full rounded-[10px] border border-[#BDBDBD] bg-white px-3 text-sm outline-none focus:border-[#224F78] sm:h-[48px] lg:h-[43px]">
          </div>

          <!-- CATEGORY -->
          <div>
            <label for="equipmentCategory" class="mb-2 block text-[17px] font-semibold lg:text-[16px]">Equipment Category</label>

            <div class="relative">
              <select id="equipmentCategory" name="category" required class="h-[46px] w-full appearance-none rounded-[10px] border border-[#BDBDBD] bg-white px-3 pr-10 text-sm outline-none focus:border-[#224F78] sm:h-[48px] lg:h-[43px]">
                <option value="">Select category</option>
              </select>

              <img src="../../assets/icons/chevron.svg" alt="" class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 object-contain">
            </div>
          </div>

          <!-- BRAND AND MODEL -->
          <div>
            <h2 class="mb-2 text-[17px] font-semibold lg:text-[16px]">Brand and Model</h2>

            <div class="grid grid-cols-2 gap-3 sm:gap-4">

              <div class="min-w-0">
                <label for="equipmentBrand" class="sr-only">Brand Name</label>
                <input id="equipmentBrand" name="brand" type="text" maxlength="80" required placeholder="Brand Name" class="h-[46px] w-full min-w-0 rounded-[10px] border border-[#BDBDBD] px-3 text-sm outline-none focus:border-[#224F78] sm:h-[48px] lg:h-[43px]">
              </div>

              <div class="min-w-0">
                <label for="equipmentModel" class="sr-only">Model</label>
                <input id="equipmentModel" name="model" type="text" maxlength="80" required placeholder="Model" class="h-[46px] w-full min-w-0 rounded-[10px] border border-[#BDBDBD] px-3 text-sm outline-none focus:border-[#224F78] sm:h-[48px] lg:h-[43px]">
              </div>

            </div>
          </div>

          <!-- EQUIPMENT PHOTOS -->
          <div>
            <label for="equipmentPhotos" class="mb-2 block text-[17px] font-semibold lg:text-[16px]">
              Photos <span class="text-sm font-normal italic">(max. of 10)</span>
            </label>

            <input id="equipmentPhotos" name="photos" type="file" accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf" multiple class="sr-only">

            <label for="equipmentPhotos" class="flex min-h-[118px] cursor-pointer flex-col items-center justify-center rounded-[21px] border border-[#BDBDBD] bg-white px-3 py-4 text-center lg:min-h-[124px] lg:rounded-[17px]">

              <img src="../../assets/icons/cloud.svg" alt="" class="mb-2 h-7 w-7 object-contain">
              <span class="text-[16px] font-semibold">Tap to Upload</span>
              <span class="mt-1 text-sm text-[#999999]">Supported formats: JPG, PNG, PDF</span>
              <span class="text-sm text-[#999999]">(Max 50MB)</span>

            </label>

            <p id="uploadError" class="mt-2 hidden text-sm text-red-600" role="alert"></p>

            <div id="photoPreview" class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4 lg:grid-cols-5"></div>
          </div>

          <!-- DESCRIPTION -->
          <div>
            <label for="equipmentDescription" class="mb-2 block text-[17px] font-semibold lg:text-[16px]">Description</label>

            <textarea id="equipmentDescription" name="description" rows="3" maxlength="2000" required placeholder="Describe your equipment" class="min-h-[71px] w-full resize-y rounded-[8px] border border-[#BDBDBD] px-3 py-3 text-sm outline-none focus:border-[#224F78] lg:min-h-[65px]"></textarea>
          </div>

          <!-- CONDITION -->
          <fieldset>
            <legend class="mb-2 text-[17px] font-semibold lg:text-[16px]">Condition</legend>

            <div class="grid grid-cols-2 gap-3 sm:gap-4">

              <label class="flex min-h-[46px] cursor-pointer items-center gap-3 rounded-[10px] border border-[#BDBDBD] px-3 lg:min-h-[43px]">
                <input type="radio" name="condition" value="Brand New" required class="h-4 w-4 shrink-0 accent-[#224F78]">
                <span class="text-sm">Brand New</span>
              </label>

              <label class="flex min-h-[46px] cursor-pointer items-center gap-3 rounded-[10px] border border-[#BDBDBD] px-3 lg:min-h-[43px]">
                <input type="radio" name="condition" value="Fairly Used" required class="h-4 w-4 shrink-0 accent-[#224F78]">
                <span class="text-sm">Fairly Used</span>
              </label>

            </div>
          </fieldset>

          <!-- ADDITIONAL INFORMATION -->
          <div>
            <label for="additionalInformation" class="mb-2 block text-[17px] font-semibold lg:text-[16px]">Additional Information</label>

            <textarea id="additionalInformation" name="additionalInformation" rows="3" maxlength="2000" placeholder="Enter any additional information" class="min-h-[71px] w-full resize-y rounded-[8px] border border-[#BDBDBD] px-3 py-3 text-sm outline-none focus:border-[#224F78] lg:min-h-[65px]"></textarea>
          </div>

          <!-- FORM FEEDBACK -->
          <p id="formMessage" class="hidden text-sm" role="status" aria-live="polite"></p>

          <!-- NEXT BUTTON -->
          <button type="submit" id="nextButton" class="w-full rounded-2xl bg-[#224F78] px-6 py-4 text-center font-semibold text-white transition hover:bg-[#173D60] disabled:cursor-not-allowed disabled:opacity-60">
            Next
          </button>

        </form>
      </section>

    </main>

  </div>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <nav aria-label="Mobile main navigation" class="fixed inset-x-0 bottom-0 z-40 grid h-[70px] grid-cols-5 border-t border-[#D5D5D5] bg-white px-2 pb-2 pt-2 lg:hidden">

    <a href="dashboard.html" class="flex flex-col items-center justify-center gap-1 text-[11px] text-[#929292]">
      <img src="../../assets/icons/ehome.svg" alt="" class="h-5 w-5 object-contain">
      <span>Home</span>
    </a>

    <a href="./equipment.html" aria-current="page" class="flex flex-col items-center justify-center gap-1 text-[11px] font-semibold text-[#224F78]">
      <img src="../../assets/icons/equipment2.svg" alt="" class="h-5 w-5 object-contain">
      <span>Equipment</span>
    </a>

    <a href="booking.html" class="flex flex-col items-center justify-center gap-1 text-[11px] text-[#929292]">
      <img src="../../assets/icons/booking.svg" alt="" class="h-5 w-5 object-contain">
      <span>Bookings</span>
    </a>

    <a href="finance.html" class="flex flex-col items-center justify-center gap-1 text-[11px] text-[#929292]">
      <img src="../../assets/icons/finance.svg" alt="" class="h-5 w-5 object-contain">
      <span>Finance</span>
    </a>

    <a href="../dispute.html" class="flex flex-col items-center justify-center gap-1 text-[11px] text-[#929292]">
      <img src="../../assets/icons/dispute.svg" alt="" class="h-5 w-5 object-contain">
      <span>Dispute</span>
    </a>

  </nav>

</body>
</html>
