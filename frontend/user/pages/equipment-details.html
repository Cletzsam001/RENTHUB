<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentHub - Item details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #252b31;
      background: #f2f8fc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --navy: #1f4e79;
      --muted: #737c84;
      --line: #e2e7eb;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #f2f8fc; }
    button, a { font: inherit; }
    a { color: inherit; text-decoration: none; }
    #sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 50;
      display: flex;
      width: 266px;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 16px 50px;
      color: #fff;
      background: var(--navy);
      transition: transform 300ms ease;
    }
    #sidebar > div:first-child { display: flex; flex-direction: column; }
    #sidebar > div:first-child > div:first-child { display: flex; align-items: center; gap: 8px; }
    #sidebar > div:first-child > div:first-child svg { width: 40px; height: 40px; flex: 0 0 40px; }
    #sidebar > div:first-child > div:first-child > span { font-size: 20px; font-weight: 600; }
    #sidebar nav { display: flex; flex-direction: column; gap: 8px; margin-top: 28px; padding: 0 8px; }
    #sidebar .nav-item {
      display: flex;
      width: 100%;
      height: 46px;
      align-items: center;
      gap: 20px;
      padding: 0 10px;
      border: 0;
      border-radius: 15px;
      color: #f3f8fc;
      background: transparent;
      text-align: left;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    #sidebar .nav-icon { display: inline-flex; width: 30px; flex: 0 0 30px; align-items: center; justify-content: center; font-size: 24px; line-height: 1; }
    #sidebar .nav-icon svg { width: 24px; height: 24px; }
    #sidebar nav > :first-child .nav-icon svg { width: 30px; height: 30px; }
    #sidebar .nav-item:hover { background: rgba(255,255,255,.10); }
    #sidebar .nav-item.active { color: var(--navy); background: #f3f8fc; }
    #sidebar .nav-item.logout { padding-left: 26px; }
    .sidebar-overlay { position: fixed; inset: 0; z-index: 45; display: block; background: rgba(19,49,76,.4); }
    .sidebar-overlay.hidden { display: none; }
    .main { min-height: 100vh; margin-left: 266px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      height: 62px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 24px;
      border-bottom: 1px solid #e8edf2;
      background: #fff;
    }
    .search-box {
      display: flex;
      width: min(100%, 360px);
      height: 38px;
      align-items: center;
      gap: 9px;
      padding: 0 11px;
      border: 1px solid #e1e7ec;
      border-radius: 9px;
      color: #98a1a8;
      background: #f7fafc;
    }
    .search-box svg { width: 17px; height: 17px; flex: 0 0 17px; }
    .search-box input { width: 100%; border: 0; outline: 0; color: #333; background: transparent; font-size: 12px; }
    .avatar { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 50%; color: #fff; background: #455d6f; font-size: 11px; font-weight: 600; }
    .menu-button { display: none; }
    .page-content { max-width: 1480px; margin: 0 auto; padding: 14px 20px 24px; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(290px, .98fr); gap: 12px; align-items: start; }
    .photo-panel, .details-panel, .related-panel { border-radius: 12px; background: #fff; }
    .photo-panel { position: relative; display: grid; min-height: 340px; place-items: center; overflow: hidden; padding: 22px; }
    .photo-panel img { width: 100%; height: 100%; max-height: 340px; object-fit: contain; }
    .back-button, .heart-btn {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #30363a;
      background: transparent;
      cursor: pointer;
    }
    .back-button { position: absolute; top: 9px; left: 9px; }
    .back-button:hover, .heart-btn:hover { background: #f2f6f8; }
    .back-button svg { width: 21px; height: 21px; }
    .photo-heart { position: absolute; top: 9px; right: 9px; }
    .heart-btn svg { width: 23px; height: 23px; }
    .heart-btn.liked svg { color: #b42318; fill: #b42318; }
    .details-panel { padding: 13px 14px 12px; }
    .product-heading { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .product-heading h1 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 650; }
    .daily-price { flex: 0 0 auto; padding-top: 3px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .subline { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: #656e75; font-size: 12px; }
    .subline svg { width: 15px; height: 15px; flex: 0 0 15px; }
    .availability { margin-top: 10px; padding-bottom: 11px; border-bottom: 1px solid var(--line); }
    .availability a, .owner-profile { margin-left: auto; color: #737c84; font-size: 10px; text-decoration: underline; white-space: nowrap; }
    .owner-row { display: flex; align-items: center; gap: 9px; padding: 10px 0 9px; }
    .owner-avatar { display: grid; width: 40px; height: 40px; flex: 0 0 40px; place-items: center; border-radius: 50%; color: #fff; background: #597385; font-size: 12px; font-weight: 600; }
    .owner-name { font-size: 12px; font-weight: 600; }
    .owner-role { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .rating { margin-top: 3px; color: #5e676e; font-size: 10px; }
    .rating-star { color: #f29b17; }
    .description-title { margin: 1px 0 5px; font-size: 12px; font-weight: 600; }
    .description { margin: 0; color: #515960; font-size: 10px; line-height: 1.45; }
    .spec-list { display: grid; gap: 0; margin: 10px 0 11px; padding: 6px 5px 0; border-top: 1px solid var(--line); }
    .spec-row { display: flex; min-height: 28px; justify-content: space-between; align-items: center; gap: 10px; color: #6d747a; font-size: 10px; }
    .spec-row strong { color: #252b31; font-size: 10px; font-weight: 600; text-align: right; }
    .rent-button { width: 100%; min-height: 39px; border: 0; border-radius: 11px; color: #fff; background: var(--navy); font-size: 12px; font-weight: 600; cursor: pointer; }
    .rent-button:hover { background: #173e62; }
    .related-panel { margin-top: 15px; padding: 10px 13px 13px; }
    .related-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
    .related-heading h2 { margin: 0; font-size: 15px; font-weight: 650; }
    .related-heading a { color: #496a91; font-size: 12px; font-weight: 600; text-decoration: underline; }
    .related-list { display: grid; gap: 5px; }
    .related-item { display: flex; min-height: 65px; align-items: center; gap: 10px; padding: 5px 8px; border: 1px solid #eee5d8; border-radius: 9px; background: #fff; cursor: pointer; }
    .related-item:hover { border-color: #b9cbd9; }
    .related-item img { width: 48px; height: 48px; flex: 0 0 48px; object-fit: contain; }
    .related-info { min-width: 0; flex: 1; }
    .related-name { overflow: hidden; font-size: 11px; font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
    .related-category, .related-location, .related-rating { margin-top: 2px; color: #737c84; font-size: 9px; }
    .related-rating span { color: #ef9713; }
    .related-side { display: flex; height: 52px; flex-direction: column; align-items: flex-end; justify-content: space-between; }
    .related-side .heart-btn { width: 25px; height: 25px; }
    .related-side .heart-btn svg { width: 17px; height: 17px; }
    .related-price { color: #30363a; font-size: 9px; white-space: nowrap; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 60; padding: 11px 16px; border-radius: 8px; color: #fff; background: #263b4b; font-size: 13px; opacity: 0; pointer-events: none; transform: translateY(8px); transition: .18s ease; }
    .toast.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 900px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .topbar { height: 58px; gap: 10px; padding: 0 14px; }
      .menu-button { display: grid; width: 42px; height: 42px; flex: 0 0 42px; place-items: center; border: 0; border-radius: 10px; color: #fff; background: var(--navy); cursor: pointer; }
      .menu-button svg { width: 20px; height: 20px; }
      .search-box { flex: 1; }
      .page-content { padding: 12px; }
      .detail-grid { grid-template-columns: minmax(0, 1fr) minmax(270px, .95fr); }
      .photo-panel { min-height: 300px; }
      .photo-panel img { max-height: 300px; }
    }
    @media (max-width: 620px) {
      .detail-grid { grid-template-columns: minmax(0, 1fr); }
      .photo-panel { min-height: min(78vw, 330px); }
      .photo-panel img { max-height: 320px; }
      .details-panel { padding: 14px; }
      .related-panel { margin-top: 12px; }
      .related-item { min-height: 68px; }
    }
  </style>

  <script src="../js/favorites.js" defer></script>
  <script src="../js/sidebar-navigation.js" defer></script>
  <script src="../js/equipment-details.js" defer></script>
</head>
